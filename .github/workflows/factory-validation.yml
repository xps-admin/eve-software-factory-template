name: Factory validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factory-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Factory validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FACTORY_REQUIRE_CLI_TESTS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Verify CLI contract dependencies
        run: |
          node --version
          gh --version
          git --version
          bash --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
